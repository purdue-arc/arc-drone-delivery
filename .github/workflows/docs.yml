name: Build & deploy flight docs

# Rebuilds the three flight-docs pages (Software Stack Reference, Flight
# Readiness Review, Flight Software Logbook) plus their index, and deploys
# them to GitHub Pages, whenever CHANGELOG.md or anything under docs-site/
# changes on the default branch. Also runnable by hand from the Actions tab.
#
# One-time setup this workflow can't do for you: in the repo's Settings →
# Pages, set "Source" to "GitHub Actions". After that, this workflow owns
# the deploy end to end — no branch, no gh-pages branch, nothing else to
# configure.
#
# If your default branch isn't `main`, change it in the `push.branches`
# list below.

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: pip install -r docs-site/requirements.txt

      - name: Generate site
        run: python docs-site/generate.py --changelog CHANGELOG.md --out docs-site/dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
