<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ground:#0a0e15; --ground-2:#0c111c;
    --surface:#111826; --surface-2:#161f30; --surface-3:#1c2740;
    --line:#232e42; --line-bright:#33415c;
    --ink:#e9eefa; --ink-2:#97a5c0; --ink-3:#5c6c8a;
    --blue:#4f8cff;    --blue-soft:rgba(79,140,255,.13);   --blue-line:rgba(79,140,255,.45);
    --violet:#a06bff;  --violet-soft:rgba(160,107,255,.13); --violet-line:rgba(160,107,255,.45);
    --emerald:#2fe6ab; --emerald-soft:rgba(47,230,171,.13); --emerald-line:rgba(47,230,171,.45);
    --amber:#ffb454;   --amber-soft:rgba(255,180,84,.14);
    --crimson:#ff6b76; --crimson-soft:rgba(255,107,118,.14);
    --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
    --body:"Manrope",ui-sans-serif,system-ui,-apple-system,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 520px at 82% -8%, rgba(160,107,255,.09), transparent 60%),
      radial-gradient(900px 480px at -6% 8%, rgba(79,140,255,.09), transparent 55%),
      var(--ground);
    color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;background-attachment:fixed;
  }
  a{color:var(--blue)}
  code,.mono{font-family:var(--mono);font-size:.85em;background:var(--surface-2);border:1px solid var(--line);padding:.1em .4em;border-radius:3px;word-break:break-word;color:var(--ink-2)}
  pre{font-family:var(--mono);font-size:.82rem;line-height:1.55;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:.8rem .95rem;overflow-x:auto;margin:.5rem 0}
  pre code{background:none;border:none;padding:0}
  ::selection{background:var(--violet-soft);color:var(--ink)}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important} }

  .grid-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:linear-gradient(rgba(150,170,210,.035) 1px, transparent 1px),linear-gradient(90deg, rgba(150,170,210,.035) 1px, transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(1100px 700px at 50% 0%, #000 40%, transparent 85%);}

  .shell{max-width:56rem;margin:0 auto;padding:0 1.6rem 6rem}

  header.site-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.3rem 0;border-bottom:1px solid var(--line);margin-bottom:2.2rem;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;gap:.15rem}
  .brand .tag{font-family:var(--mono);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--emerald)}
  .brand a.name{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
  nav.crumbs{display:flex;gap:.4rem;flex-wrap:wrap}
  nav.crumbs a{font-family:var(--mono);font-size:.76rem;font-weight:500;color:var(--ink-2);text-decoration:none;padding:.35rem .7rem;border-radius:5px;border:1px solid transparent}
  nav.crumbs a:hover{color:var(--ink);border-color:var(--line)}
  nav.crumbs a.here{color:var(--blue);background:var(--blue-soft);border-color:var(--blue-line)}

  .eyebrow{font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--violet)}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,4.4vw,2.6rem);line-height:1.08;letter-spacing:-.015em;margin:.5rem 0 0;text-wrap:balance;
     background:linear-gradient(100deg,var(--ink) 55%,var(--blue) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .standfirst{font-size:1.05rem;color:var(--ink-2);max-width:42rem;margin:.7rem 0 0}
  .meta-row{display:flex;flex-wrap:wrap;gap:.5rem 1.3rem;font-family:var(--mono);font-size:.76rem;color:var(--ink-3);border-top:1px solid var(--line);margin-top:1.1rem;padding-top:.8rem}
  .meta-row b{color:var(--ink-2);font-weight:500}

  h2{font-family:var(--display);font-weight:700;font-size:1.28rem;letter-spacing:-.01em;margin:0 0 .3rem;color:var(--ink)}
  h3{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:1.2rem 0 .5rem}
  p{margin:0 0 .8rem;color:var(--ink-2)}
  p b,li b,dd b{color:var(--ink)}
  ul,ol{margin:0 0 .8rem;padding-left:1.15rem;color:var(--ink-2)}
  li{margin-bottom:.4rem}
  li::marker{color:var(--ink-3)}

  .trace{display:flex;align-items:center;gap:.4rem;margin:1.6rem 0 1rem;height:1px}
  .trace .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--line-bright),transparent)}
  .trace .node{width:5px;height:5px;background:var(--line-bright);flex:0 0 auto}
  section.block{margin-bottom:2.4rem}

  .verdict{border-left:3px solid var(--blue);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1.2rem 1.4rem;margin:.6rem 0 1.4rem}
  .verdict.ok{border-left-color:var(--emerald)}
  .verdict.warn{border-left-color:var(--amber)}
  .verdict .big{font-family:var(--display);font-weight:700;font-size:1.14rem;margin:0 0 .4rem;color:var(--ink)}
  .verdict p:last-child{margin-bottom:0}

  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{text-align:left;padding:.6rem .75rem;vertical-align:top;border-bottom:1px solid var(--line)}
  th{font-family:var(--mono);font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;white-space:nowrap}
  tr:last-child td{border-bottom:none}
  .tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.2rem 1rem;margin-bottom:1rem}

  .pill{display:inline-block;font-family:var(--mono);font-size:.62rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:.16rem .5rem;border-radius:99px;white-space:nowrap;border:1px solid transparent}
  .p-live,.p-ok,.p-done,.p-go{background:var(--emerald-soft);color:var(--emerald);border-color:rgba(47,230,171,.35)}
  .p-sim{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-line)}
  .p-hold,.p-warn,.p-open{background:var(--amber-soft);color:var(--amber);border-color:rgba(255,180,84,.35)}
  .p-dead,.p-stop{background:var(--crimson-soft);color:var(--crimson);border-color:rgba(255,107,118,.35)}
  .p-diag,.p-unknown{background:var(--surface-2);color:var(--ink-3);border-color:var(--line-bright)}

  .cardgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:1rem}
  .cardgrid .cell{background:var(--surface);padding:1rem 1.1rem 1.1rem;display:flex;flex-direction:column;gap:.5rem}
  .cardgrid .cell .sys{font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--ink)}
  .cardgrid .cell .note{font-size:.85rem;color:var(--ink-2)}

  .layer{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:1rem}
  .lhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem .8rem;padding:.85rem 1.1rem;border-bottom:1px solid var(--line);background:var(--blue-soft)}
  .lnum{font-family:var(--mono);font-size:.7rem;font-weight:600;color:var(--blue)}
  .lname{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:-.01em;flex:1 1 14rem;color:var(--ink)}
  .lwhat{font-size:.85rem;color:var(--ink-2);flex:1 1 100%}
  .lbody{padding:.9rem 1.1rem 1.05rem}
  .lbody .comprow{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem .7rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
  .lbody .comprow:last-child{border-bottom:none}
  .lbody .comprow .cn{font-family:var(--mono);font-size:.82rem;color:var(--ink);flex:0 0 auto}
  .lbody .comprow .cd{font-size:.85rem;color:var(--ink-2);flex:1 1 18rem}

  .findings{display:flex;flex-direction:column;gap:1rem;margin-bottom:1rem}
  .finding{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1.1rem 1.3rem}
  .finding .fid{font-family:var(--mono);font-size:.78rem;color:var(--ink-3);margin-right:.5rem}
  .finding h3.ftitle{font-family:var(--display);font-weight:700;font-size:1rem;letter-spacing:-.005em;text-transform:none;color:var(--ink);margin:.15rem 0 .6rem;display:inline}
  .finding .fix{margin-top:.7rem;padding-top:.7rem;border-top:1px dashed var(--line);font-size:.87rem;color:var(--ink-2)}
  .finding .fix b{font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);display:block;margin-bottom:.2rem}
  .finding .resolution{margin-top:.7rem;padding-top:.7rem;border-top:1px solid var(--line);font-size:.87rem;color:var(--ink-2)}
  .finding .resolution b.tag{font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;display:block;margin-bottom:.25rem}
  .finding.done .resolution b.tag{color:var(--emerald)}
  .finding.open .resolution b.tag{color:var(--amber)}

  .phase{display:grid;grid-template-columns:6rem 1fr;gap:1rem;padding:1rem 0;border-top:1px solid var(--line)}
  .phase:last-child{border-bottom:1px solid var(--line)}
  .phase .tag{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);padding-top:.15rem}
  .phase h3{margin:0 0 .3rem;font-family:var(--display);font-size:.98rem;font-weight:700;text-transform:none;letter-spacing:-.005em;color:var(--ink)}
  .phase .gate{margin-top:.4rem;font-size:.84rem;color:var(--ink-3)}
  .phase .gate b{color:var(--ink-2);font-weight:600}

  .entry{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:1rem}
  .entry summary{cursor:pointer;list-style:none;padding:.95rem 1.2rem;display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:baseline}
  .entry summary::-webkit-details-marker{display:none}
  .entry summary::before{content:"›";font-family:var(--mono);color:var(--ink-3);margin-right:.2rem;transition:transform .15s}
  .entry[open] summary::before{transform:rotate(90deg);color:var(--blue)}
  .entry .date{font-family:var(--mono);font-size:.72rem;color:var(--violet);flex:0 0 auto}
  .entry .title{font-family:var(--display);font-weight:600;font-size:1rem;flex:1 1 14rem;color:var(--ink)}
  .entry .body{padding:0 1.2rem 1.1rem 2.35rem;color:var(--ink-2);font-size:.94rem}
  .entry .lede{font-size:1rem;color:var(--ink);margin-bottom:.9rem}
  .entry .subhead{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:1rem 0 .4rem}
  .entry .subhead:first-child{margin-top:0}

  .gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .gloss div{background:var(--surface);padding:.75rem 1rem}
  .gloss dt{font-family:var(--display);font-weight:700;font-size:.9rem;color:var(--ink);margin-bottom:.15rem}
  .gloss dd{margin:0;font-size:.83rem;color:var(--ink-2)}

  .linkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.9rem;margin-bottom:1rem}
  .linkcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.5rem;text-decoration:none;transition:border-color .12s,transform .12s}
  .linkcard:hover{border-color:var(--blue-line);transform:translateY(-1px)}
  .linkcard .lc-name{font-family:var(--display);font-weight:700;font-size:1.02rem;color:var(--ink)}
  .linkcard .lc-desc{font-size:.87rem;color:var(--ink-2)}
  .linkcard .go{font-family:var(--mono);font-size:.76rem;font-weight:600;color:var(--blue)}

  .badge-live{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--emerald);background:var(--emerald-soft);border:1px solid var(--emerald-line);border-radius:99px;padding:.14rem .55rem;align-self:flex-start}

  footer.site-foot{margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--line);font-size:.82rem;color:var(--ink-3);font-family:var(--mono)}
</style>
